<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Casual Pants</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./casual-pants.css" />
  </head>

  <body>
    <div class="header">
      <div class="header-inner">
        <div class="uniqlo-icon">
          <svg>
            <use href="./assets/icons/landing-page-icons.svg#uniqlo-icon"></use>
          </svg>
        </div>

        <div class="shopping-icon">
          <svg>
            <use href="./assets/icons/landing-page-icons.svg#globe-icon"></use>
          </svg>
          <svg>
            <use href="./assets/icons/landing-page-icons.svg#heart-icon"></use>
          </svg>
          <svg>
            <use href="./assets/icons/landing-page-icons.svg#cart-icon"></use>
          </svg>
        </div>
      </div>
    </div>

    <div class="main-content">
      <h1>Casual Pants</h1>

      <div class="all-products">
        <div class="cotton product">
          <h2>Cotton</h2>
          <img
            src="./images/all-products/women/casual-pants/cotton/cotton-banner.jpg"
            alt="Woman wearing a navy short-sleeve polo shirt and beige casual pull-on pants, standing in front of a cafe counter"
          />
          <div class="product-grid"></div>
        </div>

        <div class="flannel product">
          <h2>Flannel</h2>
          <img
            src="./images/all-products/women/casual-pants/flannel/flannel-banner.jpg"
            alt="Woman climbing stairs, wearing a navy sweater, dark vest, and wide-leg tartan plaid pants in blue, red, and brown."
          />
          <div class="product-grid"></div>
        </div>

        <div class="knit product">
          <h2>Knit</h2>
          <img
            src="./images/all-products/women/casual-pants/knit/knit-banner-1.avif"
            alt="Woman standing on a beach, wearing a beige baseball cap, blue button-down shirt over a dark top, and high-waist cream-colored knit wide-leg pants."
          />
          <div class="product-grid"></div>
        </div>

        <div class="sweat product">
          <h2>Sweat</h2>
          <img
            src="./images/all-products/women/casual-pants/sweat/sweat-banner-1.avif"
            alt="Woman standing on a shaded path, wearing a white oversized t-shirt, black wide-leg sweatpants, and black sandals, holding a striped shirt."
          />
          <div class="product-grid"></div>
        </div>

        <div class="others product">
          <h2>Others</h2>
          <img
            src="./images/all-products/women/casual-pants/others/others-banner.avif"
            alt="Woman standing in a bright office space, wearing a matching olive green short-sleeve collared shirt and gathered midi skirt."
          />
          <div class="product-grid"></div>
        </div>
      </div>
    </div>

    <div class="bottom-nav">
      <div class="bottom-inner">
        <button class="home-button">
          <svg>
            <use href="./assets/icons/landing-page-icons.svg#home-icon" />
          </svg>
        </button>
        <button class="search-button">
          <svg>
            <use href="./assets/icons/landing-page-icons.svg#search-icon" />
          </svg>
        </button>
        <button class="user-button">
          <svg>
            <use href="./assets/icons/landing-page-icons.svg#user-icon" />
          </svg>
        </button>
      </div>
    </div>
  </body>
</html>
