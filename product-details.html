<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/product-details.css" />
    <script src="./scripts/product-details.js" defer></script>
  </head>
  <body>
    <div class="header">
      <div class="header-inner">
        <div class="uniqlo-icon">
          <svg>
            <use href="./assets/icons/landing-page-icons.svg#uniqlo-icon"></use>
          </svg>
        </div>

        <div class="shopping-icon">
          <svg>
            <use href="./assets/icons/landing-page-icons.svg#globe-icon"></use>
          </svg>
          <svg>
            <use href="./assets/icons/landing-page-icons.svg#heart-icon"></use>
          </svg>
          <svg>
            <use href="./assets/icons/landing-page-icons.svg#cart-icon"></use>
          </svg>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="product-page">
        <div class="product-images"></div>
        <div class="product-description"></div>
      </div>
      <div class="product-info"></div>
    </div>

    <div class="bottom-nav">
      <div class="bottom-inner">
        <button class="home-button">
          <svg>
            <use href="./assets/icons/landing-page-icons.svg#home-icon" />
          </svg>
        </button>
        <button class="search-button">
          <svg>
            <use href="./assets/icons/landing-page-icons.svg#search-icon" />
          </svg>
        </button>
        <button class="user-button">
          <svg>
            <use href="./assets/icons/landing-page-icons.svg#user-icon" />
          </svg>
        </button>
      </div>
    </div>
  </body>
</html>
