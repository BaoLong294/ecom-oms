<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/product-details.css" />
    <script type="module" src="./scripts/product-details.js"></script>
    <script type="module" src="./scripts/header-cart.js"></script>
  </head>
  <body>
    <div class="header">
      <div class="header-inner">
        <div class="uniqlo-icon">
          <a href="./index.html">
            <svg>
              <use
                href="./assets/icons/landing-page-icons.svg#uniqlo-icon"
              ></use>
            </svg>
          </a>
        </div>

        <div class="shopping-icon">
          <svg>
            <use href="./assets/icons/landing-page-icons.svg#globe-icon"></use>
          </svg>
          <svg>
            <use href="./assets/icons/landing-page-icons.svg#heart-icon"></use>
          </svg>
          <a href="./shopping-cart.html">
            <svg>
              <use href="./assets/icons/landing-page-icons.svg#cart-icon"></use>
            </svg>
            <span class="cart-badge"></span>
          </a>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="product-page">
        <div class="product-images"></div>
        <div class="product-description"></div>
      </div>
      <div class="product-info"></div>
    </div>

    <div class="product-popup-overlay hidden">
      <div class="product-popup">
        <p class="popup-item"></p>
        <button class="popup-close">&times;</button>

        <div class="popup-subtotal">
          <p>Subtotal &nbsp;<span class="subtotal-item"></span></p>
          <p class="subtotal-price"></p>
        </div>

        <div class="popup-button">
          <button class="view-cart">VIEW CART</button>
          <button class="continue-shopping">CONTINUE SHOPPING</button>
        </div>
      </div>
    </div>

    <div class="bottom-nav">
      <div class="bottom-inner">
        <button class="home-button">
          <a href="./index.html">
            <svg>
              <use href="./assets/icons/landing-page-icons.svg#home-icon" />
            </svg>
          </a>
        </button>
        <button class="search-button">
          <svg>
            <use href="./assets/icons/landing-page-icons.svg#search-icon" />
          </svg>
        </button>
        <a href="./login.html">
          <button class="user-button">
            <svg>
              <use href="./assets/icons/landing-page-icons.svg#user-icon" />
            </svg>
          </button>
        </a>
      </div>
    </div>
  </body>
</html>
