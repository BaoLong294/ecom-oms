<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wishlist</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/shopping-wishlist.css" />
    <script type="module" src="./scripts/shopping-wishlist.js"></script>
    <script type="module" src="./scripts/header-cart.js"></script>
  </head>

  <body>
    <header class="header">
      <div class="header-inner">
        <div class="uniqlo-icon">
          <a href="./index.html">
            <svg>
              <use
                href="./assets/icons/landing-page-icons.svg#uniqlo-icon"
              ></use>
            </svg>
          </a>
        </div>

        <div class="shopping-icon">
          <a href="./login.html">
            <svg>
              <use
                href="./assets/icons/landing-page-icons.svg#account-icon"
              ></use>
            </svg>
          </a>
          <a href="./shopping-wishlist.html">
            <svg>
              <use
                href="./assets/icons/landing-page-icons.svg#heart-icon"
              ></use>
            </svg>
          </a>
          <a href="./shopping-cart.html">
            <svg>
              <use href="./assets/icons/landing-page-icons.svg#cart-icon"></use>
            </svg>
            <span class="cart-badge"></span>
          </a>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="breadcrumbs">
        <p><a href="./index.html">UNIQLO</a> / WISHLIST</p>
      </div>

      <h1>WISHLIST</h1>

      <div class="wishlist-empty">
        <p>Your wishlist is currently empty.</p>
        <a href="./index.html">
          <button>CONTINUE SHOPPING</button>
        </a>
      </div>

      <div class="wishlist-filled">
        <div class="wishlist-summary">
          <p class="wishlist-count"></p>
        </div>
        <div class="wishlist-items"></div>
      </div>
    </main>

    <div class="product-popup-overlay hidden">
      <div class="product-popup">
        <p class="popup-item"></p>
        <button class="popup-close">&times;</button>

        <div class="popup-subtotal">
          <p>Subtotal &nbsp;<span class="subtotal-item"></span></p>
          <p class="subtotal-price"></p>
        </div>

        <div class="popup-button">
          <button class="view-cart">VIEW CART</button>
          <button class="continue-shopping">CONTINUE SHOPPING</button>
        </div>
      </div>
    </div>
  </body>
</html>
