<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/shopping-cart.css" />
    <script type="module" src="./scripts/shopping-cart.js"></script>
  </head>

  <body>
    <header class="header">
      <div class="header-inner">
        <div class="uniqlo-icon">
          <a href="./index.html">
            <svg>
              <use
                href="./assets/icons/landing-page-icons.svg#uniqlo-icon"
              ></use>
            </svg>
          </a>
        </div>

        <div class="user-icon">
          <a href="./login.html">
            <svg>
              <use
                href="./assets/icons/shopping-cart-icons.svg#user-icon"
              ></use>
            </svg>
            <p>Account</p>
          </a>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="breadcrumbs">
        <p><a href="./index.html">UNIQLO</a> / SHOPPING CART</p>
      </div>

      <h1>SHOPPING CART</h1>

      <div class="cart-empty">
        <p>Your cart is currently empty.</p>
        <a href="./index.html">CONTINUE SHOPPING</a>
      </div>

      <div class="cart-filled">
        <div class="cart-items"></div>
        <div class="cart-summary"></div>
      </div>
    </main>
  </body>
</html>
